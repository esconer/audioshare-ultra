name: Build & Release (Linux, Windows, Android APK)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (leave blank to auto-detect from Cargo.toml)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # 1. Build Linux x86_64 GUI & CLI
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Linux Audio & GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Build Linux Release Binaries
        run: |
          cargo build --release -p audioshare-desktop-gui -p audioshare-cli
          mkdir -p dist-linux
          cp target/release/audioshare-gui dist-linux/
          cp target/release/as-ultra dist-linux/
          tar -czvf audioshare-ultra-linux-x86_64.tar.gz -C dist-linux .

      - uses: actions/upload-artifact@v6
        with:
          name: audioshare-ultra-linux-x86_64
          path: audioshare-ultra-linux-x86_64.tar.gz

  # 2. Build Windows x86_64 GUI & CLI
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Release Binaries
        run: |
          cargo build --release -p audioshare-desktop-gui -p audioshare-cli
          mkdir dist-win
          cp target/release/audioshare-gui.exe dist-win/
          cp target/release/as-ultra.exe dist-win/
          Compress-Archive -Path dist-win/* -DestinationPath audioshare-ultra-windows-x86_64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: audioshare-ultra-windows-x86_64
          path: audioshare-ultra-windows-x86_64.zip

  # 3. Build Signed Android APK (Rust NDK AAudio + Jetpack Compose)
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n 1)
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk and Build Native .so Libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          cargo install cargo-ndk
          cargo ndk --platform 26 -t arm64-v8a -t x86_64 -o ./android/app/src/main/jniLibs build --release -p audioshare-android-jni

      - name: Setup Gradle & Assemble Signed Release APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ./android
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../audioshare-ultra-android.apk

      - uses: actions/upload-artifact@v6
        with:
          name: audioshare-ultra-android-apk
          path: audioshare-ultra-android.apk

  # 4. Publish GitHub Release (Runs on tags, pushes to main, and manual workflow dispatch)
  publish-release:
    needs: [build-linux, build-windows, build-android]
    if: always() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && needs.build-android.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Create or Update GitHub Release via Native GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              TAG="${{ github.ref_name }}"
            else
              VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
              TAG="v${VERSION}"
            fi
          fi
          echo "Publishing release for tag: ${TAG}"

          # Ensure the tag exists locally and on remote
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG}" HEAD
          git push origin "${TAG}" --force || true

          gh release create "${TAG}" \
            release-assets/audioshare-ultra-linux-x86_64/audioshare-ultra-linux-x86_64.tar.gz \
            release-assets/audioshare-ultra-windows-x86_64/audioshare-ultra-windows-x86_64.zip \
            release-assets/audioshare-ultra-android-apk/audioshare-ultra-android.apk \
            --title "AudioShare Ultra ${TAG}" \
            --generate-notes || \
          gh release upload "${TAG}" \
            release-assets/audioshare-ultra-linux-x86_64/audioshare-ultra-linux-x86_64.tar.gz \
            release-assets/audioshare-ultra-windows-x86_64/audioshare-ultra-windows-x86_64.zip \
            release-assets/audioshare-ultra-android-apk/audioshare-ultra-android.apk \
            --clobber

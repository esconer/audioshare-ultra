name: Build & Release (Linux, Windows, Android APK)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (leave blank to auto-detect from Cargo.toml)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  # 1. Build Linux x86_64 GUI & CLI
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Linux Audio & GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run Workspace Tests (release gate, locked)
        run: cargo test --workspace --release --locked

      - name: Build Linux Release Binaries (.tar.gz + Debian .deb)
        run: |
          cargo build --release --locked -p audioshare-desktop-gui -p audioshare-cli
          mkdir -p dist-linux
          cp target/release/audioshare-gui dist-linux/
          cp target/release/as-ultra dist-linux/
          tar -czvf audioshare-ultra-linux-x86_64.tar.gz -C dist-linux .

          # Debian versions cannot contain '-': 1.0.0-beta.1 -> 1.0.0~beta.1
          # so dpkg/apt upgrade cleanly from the pre-release to final 1.0.0.
          VER=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          DEB_VER="${VER//-/\~}"
          PKG="dist-deb/audioshare-ultra_${DEB_VER}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications"
          cp target/release/audioshare-gui target/release/as-ultra "$PKG/usr/bin/"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: audioshare-ultra
          Version: ${DEB_VER}
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: libasound2t64 | libasound2, pulseaudio-utils | pipewire-pulse
          Maintainer: AudioShare Ultra Contributors
          Description: Low-latency wireless and USB studio audio router
          EOF
          cat > "$PKG/usr/share/applications/audioshare-ultra.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=AudioShare Ultra
          Exec=/usr/bin/audioshare-gui
          Categories=AudioVideo;Audio;
          Terminal=false
          EOF
          dpkg-deb --build "$PKG" "audioshare-ultra_${DEB_VER}_amd64.deb"

      - uses: actions/upload-artifact@v6
        with:
          name: audioshare-ultra-linux-x86_64
          path: |
            audioshare-ultra-linux-x86_64.tar.gz
            audioshare-ultra_*.deb

  # 2. Build Windows x86_64 GUI & CLI
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Windows Workspace Tests (locked)
        run: cargo test --workspace --locked

      - name: Build Windows Release Binaries
        run: |
          cargo build --release --locked -p audioshare-desktop-gui -p audioshare-cli
          mkdir dist-win
          cp target/release/audioshare-gui.exe dist-win/
          cp target/release/as-ultra.exe dist-win/
          Compress-Archive -Path dist-win/* -DestinationPath audioshare-ultra-windows-x86_64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: audioshare-ultra-windows-x86_64
          path: audioshare-ultra-windows-x86_64.zip

  # 3. Build Signed Android APK (Rust NDK AAudio + Jetpack Compose)
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f | head -n 1)
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Install Prebuilt cargo-ndk Binary (1s)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Native Android .so Libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          # Android 15/16 require 16 KB page-size alignment for native libs.
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo ndk --platform 26 -t arm64-v8a -t armeabi-v7a -t x86_64 -o ./android/app/src/main/jniLibs build --release --locked -p audioshare-android-jni

      - name: Setup Gradle & Assemble Signed Release APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode release keystore (if configured) & build R8 APK
        working-directory: ./android
        env:
          AUDIOSHARE_KEYSTORE_BASE64: ${{ secrets.AUDIOSHARE_KEYSTORE_BASE64 }}
          AUDIOSHARE_KEYSTORE_PASSWORD: ${{ secrets.AUDIOSHARE_KEYSTORE_PASSWORD }}
          AUDIOSHARE_KEY_ALIAS: ${{ secrets.AUDIOSHARE_KEY_ALIAS }}
          AUDIOSHARE_KEY_PASSWORD: ${{ secrets.AUDIOSHARE_KEY_PASSWORD }}
        run: |
          if [ -n "$AUDIOSHARE_KEYSTORE_BASE64" ]; then
            echo "$AUDIOSHARE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export AUDIOSHARE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          fi
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../audioshare-ultra-android.apk

      - uses: actions/upload-artifact@v6
        with:
          name: audioshare-ultra-android-apk
          path: audioshare-ultra-android.apk

  # 4. Publish GitHub Release (Runs on tags, pushes to main, and manual workflow dispatch)
  publish-release:
    needs: [build-linux, build-windows, build-android]
    if: always() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && needs.build-android.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Resolve release tag and checksum artifacts
        id: release_meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              TAG="${{ github.ref_name }}"
            else
              VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
              TAG="v${VERSION}"
            fi
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing release for tag: ${TAG}"
          cd release-assets
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create pre-release / release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: AudioShare Ultra ${{ steps.release_meta.outputs.release_tag }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/**/*

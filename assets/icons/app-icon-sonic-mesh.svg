<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg_obsidian" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <radialGradient id="core_glow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sonic_grad" x1="112" y1="120" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="wave_grad" x1="256" y1="176" x2="256" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Studio Chassis -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg_obsidian)" stroke="#243047" stroke-width="6"/>
  <circle cx="256" cy="256" r="220" fill="url(#core_glow)"/>

  <!-- Outer Wireless Broadcast Arcs -->
  <path d="M156 122C184 98 218 84 256 84C294 84 328 98 356 122" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="12" stroke-linecap="round"/>
  <path d="M188 152C207 136 230 126 256 126C282 126 305 136 324 152" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="12" stroke-linecap="round"/>

  <!-- Studio Headphone Arch -->
  <path d="M116 284V256C116 178.68 178.68 116 256 116C333.32 116 396 178.68 396 256V284" stroke="url(#sonic_grad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Left & Right Earcups -->
  <rect x="88" y="256" width="52" height="116" rx="26" fill="url(#sonic_grad)"/>
  <rect x="372" y="256" width="52" height="116" rx="26" fill="url(#sonic_grad)"/>

  <!-- 5-Bar Lossless Equalizer Waveform in Center -->
  <line x1="188" y1="276" x2="188" y2="332" stroke="url(#wave_grad)" stroke-width="18" stroke-linecap="round"/>
  <line x1="222" y1="232" x2="222" y2="364" stroke="url(#wave_grad)" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="192" x2="256" y2="388" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <line x1="290" y1="232" x2="290" y2="364" stroke="url(#wave_grad)" stroke-width="18" stroke-linecap="round"/>
  <line x1="324" y1="276" x2="324" y2="332" stroke="url(#wave_grad)" stroke-width="18" stroke-linecap="round"/>
</svg>

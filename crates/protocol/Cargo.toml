[package]
name = "audioshare-protocol"
version.workspace = true
edition.workspace = true

[dependencies]
# Pure-Rust Opus codec (no C/CMake/NDK library dependency). The compressed
# codec module is opt-in at runtime; lossless modes never touch it.
opus-rs = "=0.1.42"
chacha20poly1305 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
getrandom = "0.2"
